host: stats.xonotic.org
info:
  contact:
    email: antibody@xonotic.org
    name: Support
    url: https://gitlab.com/xonotic/xonstat-go/-/issues
  description: JSON and textual API for Xonotic statistics.
  license:
    name: AGPL 3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  termsOfService: http://xonotic.org/tos
  title: XonStat API
  version: "1.0"
paths:
  /game/{id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: game_id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.gameInfoJSONResponse'
      summary: Game information
  /game/{id}/weapons:
    get:
      consumes:
      - application/json
      parameters:
      - description: game_id
        in: path
        name: id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.gameWeaponInfoJSONResponse'
      summary: Weapon information for a given game formatted for Chart.js
  /games:
    get:
      consumes:
      - application/json
      parameters:
      - description: server_id filter
        in: query
        name: server_id
        type: integer
      - description: map_id filter
        in: query
        name: map_id
        type: integer
      - description: player_id filter
        in: query
        name: player_id
        type: integer
      - description: game_type_cd filter
        in: query
        name: game_type_cd
        type: string
      - description: game_id range lower bound
        in: query
        name: start_game_id
        type: integer
      - description: game_id range upper bound
        in: query
        name: end_game_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.recentGamesJSONResponse'
            type: array
      summary: Games played by various filter criteria
  /map/{id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: map_id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.mapInfoJSONResponse'
      summary: Map information
  /player/{id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: player_id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.playerInfoJSONResponse'
      summary: Player information
  /player/{id}/skill:
    get:
      consumes:
      - application/json
      parameters:
      - description: player_id
        in: path
        name: id
        required: true
        type: integer
      - description: game_type_cd
        in: query
        name: game_type_cd
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.playerSkillJSONResponse'
            type: array
      summary: Player skill information
  /player/{id}/weapons:
    get:
      consumes:
      - application/json
      parameters:
      - description: player_id
        in: path
        name: id
        required: true
        type: integer
      - description: game_type_cd
        in: query
        name: game_type_cd
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.playerWeaponInfoJSONResponse'
      summary: Player weapon information for a fixed (recent) period of time formatted
        for Chart.js
  /server/{id}:
    get:
      consumes:
      - application/json
      parameters:
      - description: server_id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.serverInfoJSONResponse'
      summary: Server information
  /server/{id}/topscorers:
    get:
      consumes:
      - application/json
      parameters:
      - description: server_id
        in: path
        name: id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.topServerJSONResponse'
      summary: Top scoring players on a particular server over a fixed time period
  /skill:
    get:
      consumes:
      - application/json
      parameters:
      - description: hashkey
        in: query
        name: hashkey
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.playerSkillJSONResponse'
            type: array
      summary: Player skill information by hashkey
  /summary:
    get:
      consumes:
      - application/json
      parameters:
      - description: scope (either 'day' or 'all')
        in: query
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.summaryJSONResponse'
      summary: Summary information about the games processed by the server in a given
        period of time.
  /topactive:
    get:
      consumes:
      - application/json
      parameters:
      - description: rank pagination offset
        in: query
        name: start
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.topActiveJSONResponse'
      summary: Top active players by playing time
  /topmaps:
    get:
      consumes:
      - application/json
      parameters:
      - description: rank pagination offset
        in: query
        name: start
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.topMapsJSONResponse'
      summary: Top maps by number of games played
  /topservers:
    get:
      consumes:
      - application/json
      parameters:
      - description: rank pagination offset
        in: query
        name: start
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.topServerJSONResponse'
      summary: Top servers by number of matches hosted.
schemes:
- https
swagger: "2.0"
