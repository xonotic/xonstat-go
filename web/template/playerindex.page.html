{{template "base" .}}

{{define "subtitle"}}Player Index - {{end}}

{{define "title"}}Player Index{{end}}

{{define "body"}}

<div class="grid-x grid-padding-x">
    <div class="cell small-12 large-6 large-offset-3">
        {{template "playerindex.partial.html" .}}
        <div class="text-center">
            <a id="load-more" class="button tiny" title="Load more players">more</a>
        </div>
    </div>
</div>
{{end}}

{{define "extra-js"}}
<script type="text/javascript">
    var nextPage={{.Next}};
    function loadMore() {
        $.ajax({
            url: "/players?start="+nextPage,
            headers: {Accept: "application/json"},     
            success: function (response) {
                $("#player-index-table tr:last").after(response.HTML);
                if (response.next === -1) {
                    // No more entries
                    $("#load-more").remove();
                }
                nextPage = response.next;
            }
        });
    };

    $("#load-more").each(function (i, e) {
        e.addEventListener("click", loadMore)
    });
</script>
{{end}}
