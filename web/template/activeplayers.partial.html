      <table class="table-hover table-condensed">
        <thead>
          <tr>
            <th class="small-1">#</th>
            <th class="small-7">Nick</th>
            <th class="small-4">Time</th>
          </tr>
        </thead>
        <tbody>
        {{range .}}
          <tr>
            <td>{{.SortOrder}}</td>
            <td class="no-stretch"><a href="{{urlFor "player_info" (intToString .PlayerID)}}" title="Go to the player info page for this player">{{.HTMLNick}}</a></td>
            <td class="no-stretch">{{.AliveTime}}</td>
          </tr>
        {{end}}
        </tbody>
      </table>
