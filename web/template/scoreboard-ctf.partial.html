<table class="table-hover table-condensed small-10 medium-11">
    <thead class="ctf">
        <tr>
            <th class="show-for-medium medium-1">Ping</th>
            <th class="small-5 medium-3">Nick</th>
            <th class="show-for-medium">Kills</th>
            <th class="small-1">Caps</th>
            <th class="show-for-medium">Pickups</th>
            <th class="show-for-medium" title="Flag Carrier Kills">FCK</th>
            <th class="show-for-medium">Returns</th>
            <th class="medium-1">Score</th>
        </tr>
    </thead>

    <tbody>
        {{range .PlayerGameStats}}
        <tr>
            {{if eq .AvgLatency 0}}
            <td class="show-for-medium medium-1 text-center">-</td>
            {{else}}
            <td class="show-for-medium medium-1 text-center">{{.AvgLatency}}</td>
            {{end}}
            <td class="small-5 medium-3 no-stretch">
                {{if gt .PlayerID 2}}
                <a href="" title="Go to the info page for this player">
                    {{.Nick.NickHTML}}
                </a>
                {{else}}
                    {{.Nick.NickHTML}}
                {{end}}
            </td>
            <td class="show-for-medium">{{.Kills}}</td>
            <td>{{.Captures}}</td>
            <td class="show-for-medium">{{.Pickups}}</td>
            <td class="show-for-medium">{{.CarrierFrags}}</td>
            <td class="show-for-medium">{{.Returns}}</td>
            <td class="medium-1">{{.Score}}</td>
        </tr>
        {{end}}
    </tbody>
</table>
