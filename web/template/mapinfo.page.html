{{template "base" .}}

{{define "subtitle"}}Map Info - {{end}}

{{define "title"}}Map Information{{end}}

{{define "body"}}
<div class="grid-x grid-padding-x">

  <div class="cell small-12">
    <h2>{{.Map.Name}}</h2>
    <p>
      Added <span class="abstime" data-epoch="{{.Map.CreateDt.Epoch}}"
        title="{{.Map.CreateDt.UTCStr}}">{{.Map.CreateDt.Fuzzy}}</span> <br />
    </p>
  </div>
</div>
{{end}}
